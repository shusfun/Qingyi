name: extension-release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run release
      - name: Verify release version
        id: assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/package version mismatch' }
          $zip = "releases/qingyi-$version-chromium.zip"
          foreach ($file in @($zip, "$zip.sha256")) {
            if (!(Test-Path -LiteralPath "../$file" -PathType Leaf)) { throw "Missing $file" }
          }
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: qingyi-chromium
          if-no-files-found: error
          path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.zip }}.sha256
      - name: Publish current version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.assets.outputs.zip }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Existing release retained for verified replacement.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --latest "../$env:RELEASE_ZIP" "../$env:RELEASE_ZIP.sha256"
          if ($LASTEXITCODE) { throw 'Release publication failed' }
